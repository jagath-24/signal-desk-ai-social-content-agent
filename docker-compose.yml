services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: signal_desk
      MYSQL_USER: signal_desk
      MYSQL_PASSWORD: signal_desk
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - signal_desk_mysql:/var/lib/mysql

volumes:
  signal_desk_mysql:
